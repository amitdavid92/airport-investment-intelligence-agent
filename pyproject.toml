[project]
name = "airport-iq"
version = "0.1.0"
description = "Airport Investment Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airport_iq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
